# Learning environment: Postgres + Jenkins on your own machine.
#
#   docker compose --env-file .env -f startup/docker-compose.yml up -d --build      (run from the repo root)
#   or: devbox run startup
#
# Jenkins:  http://localhost:8080   login admin / admin   (job "sonar-pipeline" is created for you)
# Database: sonarcube-db, reachable by the application container through the network "sonarcube-net".
#
# Everything below is a fixed value meant for a throw-away local setup, hardcoded on purpose so there is nothing
# to configure. Do not reuse these passwords anywhere real. The only two values that are NOT hardcoded are your
# SonarQube URL and token: they are company data, so they come from your git-ignored .env (SONAR_URL, SONAR_TOKEN).
name: sonarcube-startup

services:
  db:
    image: postgres:17-alpine
    container_name: sonarcube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarcube
      POSTGRES_USER: sonarcube
      POSTGRES_PASSWORD: sonarcube-learn
    ports:
      - "127.0.0.1:5433:5432" # lets you run the app on your host (devbox run run); change if 5433 is taken
    volumes:
      - sonarcube-pgdata:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # schema + sample data, only on first start
    networks:
      - sonarcube-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarcube -d sonarcube"]
      interval: 3s
      timeout: 3s
      retries: 20

  jenkins:
    build: ./jenkins
    container_name: sonarcube-jenkins
    restart: unless-stopped
    user: root # needed to use the host's docker.sock below; fine for a local learning setup
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JENKINS_ADMIN_ID: admin
      JENKINS_ADMIN_PASSWORD: admin
      # used by startup/jenkins/casc.yaml to create the credential "sonar-token" and the env SONAR_URL
      SONAR_URL: ${SONAR_URL:-https://sonarqube.example.com}
      JCASC_SONAR_TOKEN: ${SONAR_TOKEN:-set-SONAR_TOKEN-in-.env}
      # the pipeline job is created from the Jenkinsfile of this repository
      PIPELINE_REPO_URL: https://github.com/MaulanaFahrulGits/sonarcube.git
      PIPELINE_BRANCH: rnd
    volumes:
      - sonarcube-jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # the pipeline builds and runs the app image on YOUR docker
    networks:
      - sonarcube-net

networks:
  sonarcube-net:
    name: sonarcube-net

volumes:
  sonarcube-pgdata:
  sonarcube-jenkins-home:
