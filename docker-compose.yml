# The database, as separate infrastructure. Start it once (the Jenkins pipeline does NOT start it):
#   docker compose --env-file .env up -d db        (or: devbox run db-up)
# The application container joins the same network and reaches it as sonarcube-db:5432.
name: sonarcube-db

services:
  db:
    image: postgres:17-alpine
    container_name: sonarcube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarcube
      POSTGRES_USER: sonarcube
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432" # for running the app on the host (devbox run run); change if taken
    volumes:
      - sonarcube-pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro # schema + sample data, only on first start
    networks:
      - sonarcube-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarcube -d sonarcube"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  sonarcube-net:
    name: sonarcube-net

volumes:
  sonarcube-pgdata:
