# Run from the repo root so the root .env is used for the checks below:
#   docker compose --env-file .env -f jenkins/docker-compose.yml up -d --build      (or: devbox run jenkins-up)
# Only the variables listed here reach the container (not the whole .env, so TOKEN_GIT stays out).
services:
  jenkins:
    build: .
    ports: ["127.0.0.1:8080:8080"] # local R&D only; put a reverse proxy with TLS in front before exposing it
    environment:
      # fail closed: never boot without an admin password, server URL and token
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in .env}
      SONAR_URL: ${SONAR_URL:?set SONAR_URL in .env}
      # not named SONAR_TOKEN on purpose: the pipeline would treat that as a "global env var" token and skip the
      # masked credential that casc.yaml creates from this value
      JCASC_SONAR_TOKEN: ${SONAR_TOKEN:?set SONAR_TOKEN in .env}
      PIPELINE_REPO_URL: ${PIPELINE_REPO_URL:-https://github.com/MaulanaFahrulGits/sonarcube.git}
      PIPELINE_BRANCH: ${PIPELINE_BRANCH:-main}
    volumes:
      - jenkins_home:/var/jenkins_home
volumes:
  jenkins_home:
